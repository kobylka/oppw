server {
    listen 80;
    server_name monitor.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name monitor.example.com;

    root /var/www/oppw-api;
    index health.php;

    ssl_certificate /etc/letsencrypt/live/monitor.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.example.com/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location ~ ^/(?:accounts|analytics|cashflow|coordination|events-ingest|events|health|ingest|market-admin|mobile-receipt|oppw_latest_trade|pairing-admin|push-admin|service-control|status|strategy-decisions|strategy-specifications|trade-admin)\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }

    location ~ ^/(?:auth/(?:me|pair|refresh|unpair)|push/(?:register|unregister))\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }

    location / {
        return 404;
    }
}
